<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — zach</title>
<link rel="preload" href="/fonts/unbounded-900.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/jetbrains-mono-400.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face {
  font-family: 'JetBrains Mono';
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url('/fonts/jetbrains-mono-400.woff2') format('woff2');
}

@font-face {
  font-family: 'Unbounded';
  font-style: normal;
  font-weight: 900;
  font-display: swap;
  src: url('/fonts/unbounded-900.woff2') format('woff2');
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  background: #000;
  color: #3a5060;
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  -webkit-font-smoothing: antialiased;
}

body {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
  padding: clamp(2rem, 10vw, 6rem);
  gap: 1.5rem;
}

.num {
  font-family: 'Unbounded', sans-serif;
  font-weight: 900;
  font-size: clamp(5rem, 22vw, 13rem);
  line-height: 0.88;
  letter-spacing: -0.04em;
  background: linear-gradient(90deg,
    rgb(255,224,138), rgb(255,171,94), rgb(255,95,109),
    rgb(200,75,214), rgb(255,95,109), rgb(255,171,94), rgb(255,224,138));
  background-size: 200% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: ombre 6s linear infinite;
  user-select: none;
}

@keyframes ombre {
  from { background-position: 0% 50%; }
  to   { background-position: 200% 50%; }
}

.msg {
  font-size: clamp(0.85rem, 2vw, 1rem);
  color: #3a5060;
}

.back {
  font-size: clamp(0.85rem, 2vw, 1rem);
  color: #3a5060;
  text-decoration: none;
  text-underline-offset: 3px;
  transition: color 0.15s ease;
}
.back:hover { color: #fff; }

.version {
  position: fixed;
  left: clamp(2rem, 10vw, 6rem);
  bottom: clamp(1.1rem, 4vw, 1.8rem);
  font-size: 0.72rem;
  letter-spacing: 0.06em;
  color: #1a2a35;
  user-select: none;
  pointer-events: none;
}

@media (prefers-reduced-motion: reduce) {
  .num { animation: none; background-position: 50% 50%; }
}
</style>
</head>
<body>
  <div class="num" aria-label="404">404</div>
  <p class="msg">nothing here.</p>
  <a class="back" href="/">← go back</a>
  <span class="version" data-version aria-hidden="true"></span>
<script src="/version.js?v=4"></script>
</body>
</html>
