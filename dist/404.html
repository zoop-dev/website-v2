<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — zach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&family=Unbounded:wght@900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  background: #000;
  color: #3a5060;
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  -webkit-font-smoothing: antialiased;
}

body {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
  padding: clamp(2rem, 10vw, 6rem);
  gap: 1.5rem;
}

.num {
  font-family: 'Unbounded', sans-serif;
  font-weight: 900;
  font-size: clamp(5rem, 22vw, 13rem);
  line-height: 0.88;
  letter-spacing: -0.04em;
  background: linear-gradient(90deg,
    rgb(255,224,138), rgb(255,171,94), rgb(255,95,109),
    rgb(200,75,214), rgb(255,95,109), rgb(255,171,94), rgb(255,224,138));
  background-size: 200% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: ombre 6s linear infinite;
  user-select: none;
}

@keyframes ombre {
  from { background-position: 0% 50%; }
  to   { background-position: 200% 50%; }
}

.msg {
  font-size: clamp(0.85rem, 2vw, 1rem);
  color: #3a5060;
}

.back {
  font-size: clamp(0.85rem, 2vw, 1rem);
  color: #3a5060;
  text-decoration: none;
  text-underline-offset: 3px;
  transition: color 0.15s ease;
}
.back:hover { color: #fff; }

@media (prefers-reduced-motion: reduce) {
  .num { animation: none; background-position: 50% 50%; }
}
</style>
</head>
<body>
  <div class="num" aria-label="404">404</div>
  <p class="msg">nothing here.</p>
  <a class="back" href="/">← go back</a>
</body>
</html>
